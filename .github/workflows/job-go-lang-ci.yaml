name: GolangCI
# Pull requests only, and not while the PR is a draft. There is no push trigger:
# the PR run already tested the tree being merged, so nothing reruns on push to
# a branch or to main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
env:
  BUF_VERSION: v1.70.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
jobs:
  build-test:
    name: 🧪 Build & Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Postgres integration tests run only when TEST_DATABASE_DSN (vault)
    # and WORKFLOW_PG_DSN (workflow) are set. Each service gets its own
    # database on one Postgres container, which trusts connections without a
    # password, for CI only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vault_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_DSN: postgres://postgres@localhost:5432/vault_test?sslmode=disable
      WORKFLOW_PG_DSN: postgres://postgres@localhost:5432/workflow_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create the workflow test database
        run: psql -h localhost -U postgres -c 'CREATE DATABASE workflow_test'
      # go install checks each module against the Go checksum database.
      - name: Install buf and the protoc plugins
        run: |
          go install "github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
      # Fetches the callee protos pinned in proto-refs.env, which buf lint
      # needs too, so it runs first.
      - name: Generated code is current
        run: |
          scripts/proto-generate.sh
          git diff --exit-code -- gen
          test -z "$(git status --porcelain -- gen)"
      - name: buf lint
        run: buf lint
      - name: buf breaking
        run: |
          if git cat-file -e origin/main:proto 2>/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/base" origin/main
            buf breaking proto --against "$RUNNER_TEMP/base/proto"
          else
            echo "main has no proto yet; nothing to compare against"
          fi
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./... -cover
  images:
    name: 🐳 Images
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Builds every image target; nothing is pushed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the images
        run: |
          for target in vault workflow seed-catalog seed; do
            docker build --target "$target" -t "sneakers-$target:ci" .
          done
  lint:
    name: 🧹 GolangCI
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GolangCI
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # Build from source with the job's Go, so a newer go.mod never
          # outruns the toolchain the prebuilt binary was compiled with.
          install-mode: goinstall
          args: --timeout=3m
