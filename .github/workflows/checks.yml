name: checks
# The org's scrub (gitleaks, generic identifier patterns, DCO) over the PR's
# commits, title and body. The ruleset on main requires its `checks / scrub`
# status, so the caller job keeps the id `checks`. `edited` reruns it when the
# PR title or body changes.
#
# proto-sync checks the callee proto pins in proto-refs.env on each PR, and on
# the schedule opens a PR that bumps stale ones; only that job can write.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push')
      && github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # Public module hosts that appear in go.mod and go.sum: gonum.org and
      # sslmate.com. docusign.com is the vendor's public sign-in host, the
      # default in the built-in Docusign extension pack. fx.ca is not a host: it
      # is a Go field access (a test fixture's capture-audit field). The long
      # name is not a host either: it is how the host-name pattern reads the end
      # of the generated descriptor in gen/go (a message name, three protobuf
      # length bytes that happen to be letters, then github.com).
      allowed-domains: >-
        gonum.org
        sslmate.com
        docusign.com
        fx.ca
        x1a9.sneakers.vault.v1.getheartbeatstatusforprincipalresponsebizggithub.com
  proto-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: Sneakers-PAM/.github/.github/workflows/proto-sync.yml@9fcdeecfb1bc9135c89d271d27654af41f7f7391
    with:
      tools-ref: 9fcdeecfb1bc9135c89d271d27654af41f7f7391
  proto-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: Sneakers-PAM/.github/.github/workflows/proto-sync.yml@9fcdeecfb1bc9135c89d271d27654af41f7f7391
    with:
      tools-ref: 9fcdeecfb1bc9135c89d271d27654af41f7f7391
