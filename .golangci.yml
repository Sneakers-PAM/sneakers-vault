# Code-quality gate: complexity down, dead code pruned. Generated protobuf is
# excluded (not hand-authored). golangci-lint v2.
version: "2"
linters:
  enable:
    - gocyclo      # cyclomatic complexity
    - gocognit     # cognitive complexity
    - staticcheck
    - unused       # provably-dead symbols
    - govet
    - ineffassign
    - errcheck
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
  exclusions:
    rules:
      - path: '(\.pb\.go|_grpc\.pb\.go)$'
        linters: [gocyclo, gocognit, staticcheck, unused, govet, errcheck, ineffassign]
      # Tests carry legitimate setup/assertion complexity; the complexity
      # gate targets production code, not test bodies.
      - path: '_test\.go$'
        linters: [gocyclo, gocognit]
      # go-log v1.2.1 deprecates the package-level log.Ctx in favour of
      # Logger.Ctx. It still works, and each service builds one logger, so the
      # move is tracked separately rather than done inside a dependency bump.
      - linters: [staticcheck]
        text: 'SA1019: log\.Ctx is deprecated'
